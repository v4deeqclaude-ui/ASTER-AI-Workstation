name: Test ASTER Connect

on:
  push:
    branches:
      - feature/aster-v07-github-app-connect
    paths:
      - 'services/ASTER.Connect/**'
      - 'services/ASTER.Connect.Tests/**'
      - '.github/workflows/test-aster-connect.yml'
  pull_request:
    branches:
      - feature/aster-v07-github-app-connect
    paths:
      - 'services/ASTER.Connect/**'
      - 'services/ASTER.Connect.Tests/**'
      - '.github/workflows/test-aster-connect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run pairing security tests
        run: dotnet test services/ASTER.Connect.Tests/ASTER.Connect.Tests.csproj --configuration Release
