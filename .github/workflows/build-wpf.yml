name: Build ASTER WPF

on:
  push:
    branches:
      - feature/wpf-foundation-0.1
      - feature/aster-ai-chat-0.2
      - feature/aster-chatgpt-plan-auth
    paths:
      - 'windows-wpf/**'
      - '.github/workflows/build-wpf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ASTER
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Checkout pinned OpenAI Sign in with ChatGPT DevKit
        shell: pwsh
        run: |
          git clone https://github.com/openai/sign-in-with-chatgpt-devkit.git devkit
          git -C devkit checkout 0a36fefeb913055c8c7a1a29b63d82b96b2e841a
          npm ci --prefix devkit
          npm run build -w @siwc/local --prefix devkit

      - name: Stage official SDK and notices
        shell: pwsh
        run: |
          $vendor = "windows-wpf/aster-chatgpt-bridge/vendor/siwc-local"
          New-Item -ItemType Directory -Force $vendor | Out-Null
          Copy-Item "devkit/packages/local/package.json" "$vendor/package.json"
          Copy-Item "devkit/packages/local/LICENSE" "$vendor/LICENSE"
          Copy-Item "devkit/packages/local/dist" "$vendor/dist" -Recurse
          Copy-Item "devkit/THIRD_PARTY_NOTICES.md" "windows-wpf/aster-chatgpt-bridge/THIRD_PARTY_NOTICES.md"
          Copy-Item "devkit/LICENSE" "windows-wpf/aster-chatgpt-bridge/OPENAI-DEVKIT-LICENSE"
          npm install --prefix windows-wpf/aster-chatgpt-bridge --omit=dev --no-audit --no-fund

      - name: Test helper protocol and Windows DPAPI
        shell: pwsh
        run: |
          $result = node windows-wpf/aster-chatgpt-bridge/bridge.mjs --self-test | ConvertFrom-Json
          if (-not $result.ok -or -not $result.browserAllowlist) { throw "ChatGPT bridge self-test failed." }
          Write-Host "ChatGPT bridge self-test passed."

      - name: Restore WPF dependencies
        run: dotnet restore windows-wpf/ASTER.Workstation.sln

      - name: Publish Windows x64 application
        run: dotnet publish windows-wpf/src/ASTER.Workstation.App/ASTER.Workstation.App.csproj --configuration Release --runtime win-x64 --self-contained true --output windows-wpf/artifacts/publish

      - name: Package ChatGPT bridge and Node runtime
        shell: pwsh
        run: |
          $destination = "windows-wpf/artifacts/publish/ChatGPTBridge"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "windows-wpf/aster-chatgpt-bridge/bridge.mjs" "$destination/bridge.mjs"
          $sourceModules = "windows-wpf/aster-chatgpt-bridge/node_modules"
          $targetModules = "$destination/node_modules"
          if (-not (Test-Path "$sourceModules/@siwc/local")) { throw "Installed @siwc/local dependency is missing." }
          if (-not (Test-Path "$sourceModules/@primno/dpapi")) { throw "Installed @primno/dpapi dependency is missing." }
          # Copy-Item -Recurse can be extremely slow on Windows runners for deep npm trees.
          # Robocopy uses multiple threads and returns 0-7 for success/non-fatal differences.
          robocopy $sourceModules $targetModules /E /MT:16 /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with exit code $LASTEXITCODE." }
          $LASTEXITCODE = 0
          $nodeExe = (Get-Command node).Source
          Copy-Item $nodeExe "$destination/node.exe"
          Copy-Item "windows-wpf/aster-chatgpt-bridge/OPENAI-DEVKIT-LICENSE" "$destination/OPENAI-DEVKIT-LICENSE"
          Copy-Item "windows-wpf/aster-chatgpt-bridge/THIRD_PARTY_NOTICES.md" "$destination/THIRD_PARTY_NOTICES.md"
          if (-not (Test-Path "$destination/node.exe")) { throw "Bundled Node.js runtime is missing." }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-AI-Workstation-0.2-chatgpt-auth-win-x64
          path: windows-wpf/artifacts/publish/
          if-no-files-found: error
          retention-days: 14
