name: Build ASTER WPF

on:
  push:
    branches:
      - feature/wpf-foundation-0.1
      - feature/aster-ai-chat-0.2
      - feature/aster-chatgpt-plan-auth
      - fix/aster-oauth-diagnostics-2026-11
      - feature/aster-neon-future-ui
      - feature/aster-v04-deep-space
      - feature/aster-v05-plugin-marketplace
      - feature/aster-v06-mcp-transports
      - feature/aster-v07-github-app-connect
    paths:
      - 'windows-wpf/**'
      - 'services/ASTER.Connect/**'
      - 'services/ASTER.Connect.Tests/**'
      - '.github/workflows/build-wpf.yml'
  pull_request:
    branches:
      - fix/aster-oauth-diagnostics-2026-11
      - feature/aster-workspace-hierarchy-v2
      - feature/aster-v04-deep-space
      - feature/aster-v05-plugin-marketplace
      - feature/aster-v06-mcp-transports
      - feature/aster-v07-github-app-connect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ASTER
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore WPF dependencies
        run: dotnet restore windows-wpf/ASTER.Workstation.sln
      - name: Run ASTER Connect security tests
        run: dotnet test services/ASTER.Connect.Tests/ASTER.Connect.Tests.csproj --configuration Release
      - name: Publish ASTER Connect self-contained for Windows x64
        run: dotnet publish services/ASTER.Connect/ASTER.Connect.csproj --configuration Release --runtime win-x64 --self-contained true --output services/ASTER.Connect/artifacts/publish-win-x64
      - name: Publish Windows x64 application
        run: dotnet publish windows-wpf/src/ASTER.Workstation.App/ASTER.Workstation.App.csproj --configuration Release --runtime win-x64 --self-contained true --output windows-wpf/artifacts/publish
      - name: Bundle ASTER Connect inside ASTER
        shell: pwsh
        run: |
          $service = "services/ASTER.Connect/artifacts/publish-win-x64"
          $app = "windows-wpf/artifacts/publish"
          if (-not (Test-Path "$service/ASTER.Connect.exe")) { throw "ASTER Connect executable was not produced." }
          if (-not (Test-Path "$service/coreclr.dll")) { throw "Self-contained .NET runtime is missing from ASTER Connect." }
          if (-not (Test-Path "$app/ASTER.Workstation.exe")) { throw "ASTER executable was not produced." }
          New-Item -ItemType Directory -Force -Path "$app/ASTER.Connect" | Out-Null
          Copy-Item -Path "$service/*" -Destination "$app/ASTER.Connect" -Recurse -Force
          if (-not (Test-Path "$app/ASTER.Connect/ASTER.Connect.exe")) { throw "ASTER Connect was not bundled into the desktop app." }
          Write-Host "ASTER and its self-contained ASTER Connect service are bundled together."
      - name: Upload Windows application with bundled connector
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-AI-Workstation-0.7-github-app-connect-win-x64
          path: windows-wpf/artifacts/publish/
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone ASTER Connect Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Connect-0.7-win-x64-self-contained
          path: services/ASTER.Connect/artifacts/publish-win-x64/
          if-no-files-found: error
          retention-days: 14
