name: Build ASTER WPF

on:
  push:
    branches:
      - feature/wpf-foundation-0.1
      - feature/aster-ai-chat-0.2
      - feature/aster-chatgpt-plan-auth
      - fix/aster-oauth-diagnostics-2026-11
    paths:
      - 'windows-wpf/**'
      - '.github/workflows/build-wpf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ASTER
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore WPF dependencies
        run: dotnet restore windows-wpf/ASTER.Workstation.sln

      - name: Publish Windows x64 application
        run: dotnet publish windows-wpf/src/ASTER.Workstation.App/ASTER.Workstation.App.csproj --configuration Release --runtime win-x64 --self-contained true --output windows-wpf/artifacts/publish

      - name: Verify Ollama client is included
        shell: pwsh
        run: |
          $publish = "windows-wpf/artifacts/publish"
          if (-not (Test-Path "$publish/ASTER.Workstation.exe")) {
            throw "ASTER executable was not produced."
          }
          Write-Host "ASTER Ollama-only application published."

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-AI-Workstation-0.3-ollama-win-x64
          path: windows-wpf/artifacts/publish/
          if-no-files-found: error
          retention-days: 14
