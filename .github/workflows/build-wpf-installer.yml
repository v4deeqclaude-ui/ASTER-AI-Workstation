name: Build ASTER WPF Windows Installer

on:
  push:
    branches:
      - feature/aster-ai-chat-0.2
    tags:
      - 'v0.2.*'
    paths:
      - 'windows-wpf/**'
      - '.github/workflows/build-wpf-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore windows-wpf/ASTER.Workstation.sln

      - name: Publish self-contained Windows x64 app
        run: dotnet publish windows-wpf/src/ASTER.Workstation.App/ASTER.Workstation.App.csproj --configuration Release --runtime win-x64 --self-contained true --output windows-wpf/artifacts/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows-wpf/installer/ASTER.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-AI-Workstation-0.2-Setup-win-x64
          path: windows-wpf/artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v0.2.')
        uses: softprops/action-gh-release@v2
        with:
          name: ASTER AI Workstation 0.2
          generate_release_notes: true
          files: windows-wpf/artifacts/installer/*.exe
